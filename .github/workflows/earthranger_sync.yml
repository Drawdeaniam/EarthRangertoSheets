name: EarthRanger to Google Sheets

on:
  schedule:
    # Shift away from :00 to bypass GitHub queue congestion
    - cron: '27 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Caches dependencies to speed up runs

      - name: Install dependencies
        run: |
          pip install requests pandas gspread google-auth openpyxl

      - name: Run Script
        env:
          ER_TOKEN: ${{ secrets.ER_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python main.py
